name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          for file in server.js config/*.js middleware/*.js routes/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Smoke-test backend route imports
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-not-used-for-real-authentication
        run: node --input-type=module -e "await import('./routes/recordRoutes.js')"

      - name: Run backend smoke and grading tests
        working-directory: backend
        run: npm test

      - name: Smoke-test administrator CORS preflight
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-not-used-for-real-authentication
          CORS_ORIGIN: https://portal.example
        run: |
          node --input-type=module -e '
            const { default: app } = await import("./server.js");
            const server = app.listen(0, "127.0.0.1");
            await new Promise((resolve) => server.once("listening", resolve));
            try {
              const { port } = server.address();
              const response = await fetch(`http://127.0.0.1:${port}/api/admin/catalog`, {
                method: "OPTIONS",
                headers: {
                  Origin: "https://portal.example",
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "authorization,content-type,x-step-up-token"
                }
              });
              const allowed = response.headers.get("access-control-allow-headers")?.toLowerCase() || "";
              if (!response.ok || !allowed.includes("x-step-up-token")) throw new Error(`CORS preflight failed: ${response.status} ${allowed}`);
            } finally {
              await new Promise((resolve, reject) => server.close((error) => error ? reject(error) : resolve()));
            }
          '

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production backend image
        run: docker build -f backend/Dockerfile .

      - name: Build production frontend image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=https://api.example.test/api frontend
